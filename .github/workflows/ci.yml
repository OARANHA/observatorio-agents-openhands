name: CI Observatorio
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Conferir geração
        run: |
          node scripts/build.mjs
          git diff --exit-code -- extension.js
      - name: Contrato e sintaxe
        run: python3 -m unittest discover -s tests -p 'test*.py' -v
      - name: Contrato JavaScript de leitura pontual (offline)
        run: node --test tests/point_read_validation.test.mjs

      - name: Contrato sintético CYCLE011-B (offline)
        run: node --test tests/cycle011_b_discovery_contract.test.mjs

      - name: Gate estático de autoridade CYCLE011-B05 (offline)
        run: node --test tests/cycle011_b05_authority_gate.test.mjs

      - name: Identidade e RBAC sintéticos CYCLE011-B08 (offline)
        run: node --test tests/cycle011_b08_identity_rbac.test.mjs

      - name: CYCLE011-C01 host e ACL sintéticos (offline)
        run: node --test tests/cycle011_c01_host_rbac.test.mjs
