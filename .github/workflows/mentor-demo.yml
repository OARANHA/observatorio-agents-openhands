name: Mentor Demo Offline DOM
on:
  pull_request:
    paths:
      - tools/mentor-demo/**
      - scripts/build_mentor_demo.mjs
      - tests/mentor_demo_contract.mjs
      - tests/test_mentor_demo_offline.py
      - tests/browser/mentor_dom.mjs
      - .github/workflows/mentor-demo.yml
permissions:
  contents: read
jobs:
  mentor-dom:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Contrato e geração da DEMO independente
        run: |
          node --test tests/mentor_demo_contract.mjs
          node scripts/build_mentor_demo.mjs --check
      - name: Dependência de teste efêmera fixada, sem scripts de instalação
        run: npm install --prefix "$RUNNER_TEMP/obs-mentor-dom" --ignore-scripts --no-audit --no-fund playwright@1.58.0
      - name: Chromium oficial no runner efêmero
        run: node "$RUNNER_TEMP/obs-mentor-dom/node_modules/playwright/cli.js" install --with-deps chromium --only-shell
      - name: DOM fictício sem rede, com sandbox Chromium obrigatório
        run: OBS_PLAYWRIGHT_MODULE="$RUNNER_TEMP/obs-mentor-dom/node_modules/playwright" node --test --test-reporter=tap tests/browser/mentor_dom.mjs
      - name: Screenshots exclusivamente das fixtures sintéticas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mentor-synthetic-screenshots
          path: test-artifacts/mentor/*.png
          if-no-files-found: error
          retention-days: 3
