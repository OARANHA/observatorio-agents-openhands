name: Canary Worker Inert SDK

on:
  pull_request:
    paths:
      - docs/**
      - MEMORY.md
      - tests/test_canary_*.py
      - scripts/probe_canary_sandbox.py
      - .github/workflows/canary-worker-inert.yml
      - scripts/probe_canary_worker.py
      - scripts/canary_sdk.py
      - scripts/canary_controls.py
      - scripts/canary_budget.py
      - scripts/canary_budget_boundary.py
      - scripts/canary_transport_probe.py
      - scripts/canary_sdk_success_probe.py
      - scripts/canary_accounting_evidence.py
      - scripts/canary_audit_bundle.py
      - scripts/audit_canary_sdk_transport.py
      - tests/test_canary_accounting_hardening.py
      - tests/test_canary_transport_attempts.py
      - tests/test_canary_sdk_transport_audit.py
      - tests/test_sdk_real_transport_offline.py
      - tests/test_canary_budget_boundary.py
      - tests/test_canary_budget_sdk_surface.py
      - tests/test_canary_worker_wiring.py
      - tests/test_canary_sdk_manager.py

permissions:
  contents: read

jobs:
  inert-worker:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout sem credenciais persistidas
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python controlado
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar somente dependências do runner efêmero
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bubblewrap apparmor-profiles apparmor-utils
          PROFILE=/usr/share/apparmor/extra-profiles/bwrap-userns-restrict
          test -f "$PROFILE" || { echo "NO-GO: perfil do Bubblewrap não encontrado"; exit 1; }
          sudo install -m 0644 "$PROFILE" /etc/apparmor.d/bwrap-userns-restrict
          sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
          python -m venv "$RUNNER_TEMP/observatorio-canary-sdk"
          "$RUNNER_TEMP/observatorio-canary-sdk/bin/pip" install --disable-pip-version-check --no-input --no-cache-dir 'openhands-sdk==1.53.0' 'openhands-tools==1.53.0'
      - name: Isolamento negativo real no runner efêmero (sem SDK)
        run: python3 -B scripts/probe_canary_sandbox.py
      - name: Contabilidade adversarial sintetica sem transporte
        run: |
          "$RUNNER_TEMP/observatorio-canary-sdk/bin/python" -B -m unittest discover -s tests -p test_canary_accounting_hardening.py -v
      - name: Falhas de supervisão e cleanup sem operações
        run: |
          "$RUNNER_TEMP/observatorio-canary-sdk/bin/python" -B -m unittest discover -s tests -p test_canary_supervisor_failures.py -v
      - name: Evidencia contábil fictícia minimizada
        run: |
          "$RUNNER_TEMP/observatorio-canary-sdk/bin/python" -B scripts/canary_accounting_evidence.py
      - name: Integridade e proveniência declarada de evidências sintéticas
        run: |
          "$RUNNER_TEMP/observatorio-canary-sdk/bin/python" -B -m unittest discover -s tests -p test_canary_audit_bundle.py -v
      - name: Compatibilidade do TaskManager oficial sem LLM
        run: |
          "$RUNNER_TEMP/observatorio-canary-sdk/bin/python" -B -m unittest discover -s tests -p test_canary_sdk_manager.py -v
      - name: Assinaturas oficiais SDK LLM sem transporte/provedor
        run: |
          "$RUNNER_TEMP/observatorio-canary-sdk/bin/python" -B -m unittest discover -s tests -p test_canary_budget_sdk_surface.py -v
      - name: Inventario da fonte oficial de transportes SDK 1.53.0 (sem chamadas)
        run: |
          "$RUNNER_TEMP/observatorio-canary-sdk/bin/python" -B -m unittest discover -s tests -p test_canary_sdk_transport_audit.py -v
      - name: Provas negativas de tentativas sinteticas de transporte (sem provedor)
        run: |
          "$RUNNER_TEMP/observatorio-canary-sdk/bin/python" -B -m unittest discover -s tests -p test_canary_transport_attempts.py -v
      - name: SDK real contra stubs isolados de rede (zero provedor)
        env:
          OBS_CANARY_HOST_NETNS: unused
        run: |
          set -euo pipefail
          HOST_NS="$(readlink /proc/self/ns/net)"
          test -n "$HOST_NS"
          bwrap --unshare-all --die-with-parent --new-session \
            --clearenv \
            --ro-bind / / \
            --proc /proc \
            --dev /dev \
            --tmpfs /tmp \
            --setenv PATH /usr/bin:/bin \
            --setenv HOME /tmp \
            --setenv PYTHONDONTWRITEBYTECODE 1 \
            --setenv LITELLM_LOCAL_MODEL_COST_MAP True \
            --setenv OBS_CANARY_HOST_NETNS "$HOST_NS" \
            --chdir "$GITHUB_WORKSPACE" \
            -- "$RUNNER_TEMP/observatorio-canary-sdk/bin/python" -B -m unittest discover \
               -s tests -p test_sdk_real_transport_offline.py -v
      - name: Worker supervisionado com TaskToolSet real e terminal bwrap restrito
        run: |
          "$RUNNER_TEMP/observatorio-canary-sdk/bin/python" -B scripts/probe_canary_worker.py --supervise-synthetic-worker
